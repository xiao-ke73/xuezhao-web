:root{
  --bg:#0b0f11; --panel:rgba(13,18,20,.80); --panel2:rgba(22,29,32,.86);
  --line:rgba(205,218,214,.14); --line2:rgba(205,218,214,.28);
  --fog:#d9e0dd; --text:#e5eae8; --muted:#8f9d99; --dim:#66726f;
  --teal:#78ad9f; --teal-deep:#1f3b35; --gold:#bfa46d; --red:#bf5544;
  --title:"XZT","Noto Serif SC","Songti SC","STSong",serif;
  --body:"Noto Serif SC","Songti SC","STSong","Source Han Serif SC","Noto Serif CJK SC","SimSun",serif;
  --ui:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  color-scheme:dark; font-synthesis:none;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16.5px;line-height:1.9;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.muted{color:var(--muted)}

/* 细雨 */
.rain{position:absolute;inset:-10%;pointer-events:none;opacity:.32;
  background-image:repeating-linear-gradient(104deg,rgba(230,238,236,.55) 0 1px,transparent 1px 9px),repeating-linear-gradient(100deg,rgba(230,238,236,.35) 0 1px,transparent 1px 23px);
  background-size:180px 140px,260px 220px;animation:rain 1.1s linear infinite;mask-image:linear-gradient(transparent,#000 20%,#000 80%,transparent)}
@keyframes rain{to{background-position:-38px 140px,-46px 220px}}
@media(prefers-reduced-motion:reduce){.rain{animation:none}}

/* ---------- 封面 ---------- */
#cover{position:relative;min-height:100vh;min-height:100dvh;overflow:hidden;background:#20272a}
.cv-img{position:absolute;inset:0}
.cv-img img{width:100%;height:100%;object-fit:cover;object-position:50% 62%}
.cv-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(220,228,226,.0) 0%,rgba(220,228,226,0) 30%,rgba(11,15,17,.15) 55%,rgba(11,15,17,.86) 78%,rgba(11,15,17,.97) 100%)}
.cv-body{position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:space-between;padding-block:7vh 28px;padding-inline:22px;max-width:560px;margin:0 auto}
.cv-top{color:#141a1b}
.cv-eyebrow{font-family:var(--ui);font-size:12px;letter-spacing:.42em;color:rgba(20,26,27,.72)}
.cv-title{font-family:var(--title);font-weight:400;font-size:clamp(96px,30vw,168px);line-height:.95;margin:10px 0 0;letter-spacing:.04em;color:#111617;text-shadow:0 0 30px rgba(230,236,234,.55)}
.cv-sub{display:flex;align-items:center;gap:10px;margin-top:12px;font-family:var(--title);font-size:18px;letter-spacing:.3em;color:rgba(17,22,23,.85)}
.cv-sub i{display:block;width:34px;height:1px;background:rgba(17,22,23,.6)}
.cv-bottom{display:grid;gap:18px}
.tagline{font-size:17px;line-height:1.9;color:#dfe6e3;margin:0;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.btn-col{display:flex;flex-direction:column;gap:10px}
.btn{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line2);background:rgba(13,18,20,.55);backdrop-filter:blur(6px);padding:13px 18px;border-radius:2px;font-family:var(--ui);font-size:15px;text-align:left;transition:background .2s,border-color .2s}
.btn:hover{background:rgba(31,59,53,.6);border-color:var(--teal)}
.btn.primary{background:var(--fog);color:#111617;border-color:var(--fog);font-weight:600}
.btn.primary:hover{background:#fff}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn small{font-size:12px;opacity:.7}
.cv-foot{font-family:var(--ui);font-size:12px;color:var(--muted)}
@media(min-width:900px){
  #cover{display:grid;grid-template-columns:minmax(0,46%) 1fr}
  .cv-img{position:relative;inset:auto;height:100vh}
  .cv-shade{background:linear-gradient(90deg,transparent 60%,rgba(11,15,17,.9))}
  .cv-body{justify-content:center;gap:48px;max-width:520px}
  .cv-top,.cv-eyebrow,.cv-sub{color:var(--fog)}.cv-title{color:var(--fog);text-shadow:none}.cv-sub i{background:var(--line2)}.cv-eyebrow{color:var(--muted)}
}

/* ---------- 建人物 ---------- */
#create{position:relative;min-height:100vh;min-height:100dvh}
.bgfix{position:fixed;inset:0;z-index:-1;background:linear-gradient(rgba(11,15,17,.78),rgba(11,15,17,.93)),var(--img,none) center/cover no-repeat}
.wrap{max-width:720px;margin:0 auto;padding-block:32px 100px;padding-inline:16px}
.card{background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--line);padding:22px 18px}
.sec-title{font-family:var(--title);font-weight:400;font-size:32px;margin:0 0 4px;letter-spacing:.06em}
.sec-sub{font-family:var(--ui);font-size:13px;color:var(--muted);margin:0 0 20px}
.field{display:grid;gap:8px;margin-bottom:20px}
.flabel,.field label{font-family:var(--ui);font-size:12px;color:var(--teal);letter-spacing:.2em}
input[type=text],input[type=password]{width:100%;background:rgba(0,0,0,.25);border:1px solid var(--line2);color:var(--text);padding:12px;font-family:var(--ui);font-size:15px;border-radius:2px}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:10px;border:1px solid var(--line2);background:transparent;border-radius:2px;font-family:var(--title);font-size:19px}
.seg button.on{background:var(--fog);color:#111617;border-color:var(--fog)}
.points{display:grid;gap:10px}
.prow{display:grid;grid-template-columns:3em 1fr auto;align-items:center;gap:12px}
.prow .nm{font-family:var(--title);font-weight:400;font-size:22px}
.prow .desc{font-family:var(--ui);font-size:12px;color:var(--muted);line-height:1.4}
.stepper{display:flex;align-items:center;border:1px solid var(--line2)}
.stepper button{width:36px;height:36px;background:transparent;border:0;font-size:18px}
.stepper span{min-width:38px;text-align:center;font-family:var(--ui);font-variant-numeric:tabular-nums;font-size:17px}
.remain{font-family:var(--ui);font-size:13px;margin-top:4px}
.remain b{font-variant-numeric:tabular-nums;color:var(--fog);font-size:17px}
.talents{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tal{border:1px solid var(--line);background:rgba(0,0,0,.2);padding:12px;text-align:left;border-radius:2px;display:grid;gap:4px}
.tal b{font-size:18px;font-weight:700}
.tal span{font-family:var(--ui);font-size:12px;color:var(--muted);line-height:1.5}
.tal.on{border-color:var(--teal);background:rgba(31,59,53,.55)}
.tal.off{opacity:.35}
.err{font-family:var(--ui);font-size:13px;color:#e29a8b;min-height:1.4em}

/* ---------- 剧情页 ---------- */
#game{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(0,1fr)}
@media(min-width:1000px){#game{grid-template-columns:minmax(0,1fr) 300px}}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:rgba(11,15,17,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.tb-row{display:flex;gap:8px;align-items:center;padding:9px 16px}
.chips{display:flex;gap:8px;overflow-x:auto;white-space:nowrap;flex:1;min-width:0;scrollbar-width:none}
.chip{font-family:var(--ui);font-size:12px;border:1px solid var(--line);padding:3px 10px;border-radius:999px;color:#c7d2ce}
.chip.act{border-color:var(--teal);color:#cfe7e0}
.iconbtn{font-family:var(--ui);font-size:12px;border:1px solid var(--line);background:transparent;padding:4px 10px;border-radius:2px}
.goal{font-family:var(--ui);font-size:12px;color:var(--teal);padding:0 16px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.modal{position:fixed;inset:0;z-index:30;background:rgba(6,9,10,.82);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px}

textarea{width:100%;min-height:120px;background:rgba(0,0,0,.3);color:var(--text);border:1px solid var(--line2);font-family:var(--ui);font-size:12px;padding:10px}

<body>


<!-- 封面 -->
<section id="cover" hidden>
  <div class="cv-img"><img src="img/cover.jpg" alt="雨中，披青色斗篷的刀客背对着雾中群山"><div class="cv-shade"></div><div class="rain"></div></div>
  <div class="cv-body">
    <div class="cv-top">
      <div class="cv-eyebrow">大胤 · 江湖模拟器</div>
      <h1 class="cv-title">血诏</h1>
      <div class="cv-sub"><i></i>青萍门篇</div>
    </div>
    <div class="cv-bottom">
      <p class="tagline">先帝新丧，少年天子出逃。<br>一道遗诏下落不明，半个江湖为它拔刀。<br>你的每一刀，都算数。</p>
      <div class="btn-col">
        <button class="btn primary" id="btnNew">开始新的江湖 <small>建人物</small></button>
        <button class="btn" id="btnContinue" hidden>继续上次 <small id="contInfo"></small></button>
        <button class="btn" id="btnDemo">先看看演示 <small>不用 key</small></button>
        <button class="btn" id="btnCfg">设置 DeepSeek Key <small id="keyState">未设置</small></button>
      </div>
      <div class="cv-foot">作者：【在这里填你的抖音号】 · 主线固定，选择决定结局</div>
    </div>
  </div>
</section>

<!-- 建人物 -->
<section id="create" hidden>
  <div class="bgfix" style="--img:url(img/gate2.jpg)"></div>
  <div class="wrap">
    <div class="card">
      <h2 class="sec-title">落笔留名</h2>
      <p class="sec-sub">你是青萍门的一名弟子。属性一旦定下，就要带着它走完整个江湖。</p>
      <div class="field"><label for="inName">名字</label><input type="text" id="inName" maxlength="8" placeholder="比如：江凛雾"></div>
      <div class="field"><span class="flabel">性别</span><div class="seg" id="segGender"><button data-v="女" class="on">女</button><button data-v="男">男</button></div></div>
      <div class="field"><span class="flabel">出身 · 你是怎么进的青萍门</span><div class="talents" id="origins"></div></div>
      <div class="field"><span class="flabel">加点 · 每项 3 到 12</span><div class="points" id="points"></div><div class="remain">剩余点数 <b id="remain">30</b></div></div>

      <div class="err" id="createErr"></div>
      <div class="btn-col"><button class="btn primary" id="btnStart" disabled>踏入江湖 <small>第一幕 · 下山</small></button><button class="btn" id="btnBack">返回</button></div>
    </div>
  </div>
</section>

<!-- 剧情页 -->
<section id="game" hidden>
  <div class="bgfix" id="gameBg"></div>
  <main>
    <div class="topbar">
      <div class="tb-row"><div class="chips"><span class="chip act" id="chipAct">第一幕</span><span class="chip" id="chipRank">无名小卒</span><span class="chip" id="chipNode">—</span><span class="chip" id="chipTime">—</span><span class="chip" id="chipPlace">—</span></div><button class="iconbtn" id="btnHome">封面</button></div>
      <div class="goal" id="goal" hidden></div>
      <nav class="tabs" id="tabsTop"></nav>
    </div>
    <div class="view" id="vStory"><div class="story" id="story" aria-live="polite"></div></div>
    <div class="view" id="vChron" hidden><div class="page" id="chron"></div></div>
    <div class="view" id="vPeople" hidden><div class="page" id="people"></div></div>
    <div class="view" id="vBag" hidden><div class="page" id="bag"></div></div>
  </main>
  <aside class="side" id="side"></aside>
  <nav class="tabs" id="tabsBottom"></nav>
</section>

<div id="modalRoot"></div>

<script>
(()=>{
const $=s=>document.querySelector(s);

];
const ORIGINS=[

function splitLong(arr){const out=[];(arr||[]).forEach(p=>{p=String(p||'').trim();if(!p)return;if(p.length<=80||/^[^：:\s]{1,6}[：:]/.test(p)&&p.length<=110){out.push(p);return}
  const ss=p.match(/[^。！？!?…]+[。！？!?…」”]*/g)||[p];let cur='';ss.forEach(s=>{if(cur&&(cur+s).length>70){out.push(cur);cur=s}else cur+=s});if(cur)out.push(cur)});return out}
function paraEl(p){const m=String(p).match(/^([^：:\s]{1,6})[：:]([\s\S]+)$/);if(m)return `<div class="say"><span class="who">${esc(m[1])}</span><span class="w">${esc(m[2].trim())}</span></div>`;return `<p class="para">${esc(p)}</p>`}
const TCLS={'大成功':'t-big','成功':'t-ok','勉强':'t-mid','失败':'t-fail'};
function changesEl(list){return list&&list.length?`<div class="changes">${list.map(c=>`<div class="${c.d>0?'up':'dn'}"><b>${esc(c.label)} ${c.d>0?'+':''}${c.d}</b><i>${c.reason?esc(c.reason):''}</i></div>`).join('')}</div>`:''}
function turnEl(t){
  const d=document.createElement('div');d.className='turn';let h='';
  if(t.rest){h+=`<div class="restline">歇脚 · ${esc(t.label)}</div>${changesEl(t.changes)}${t.note?`<p class="note">${esc(t.note)}</p>`:''}`;d.innerHTML=h;return d}
  if(t.actStart)h+=`<div class="act-banner"><img src="${ACT_IMG[t.actStart]||ACT_IMG[1]}" alt=""><div class="ov"><div class="n">第${CN[t.actStart]||t.actStart}幕</div><div class="t">${esc(ACT_NAMES[t.actStart]||'')}</div></div></div>`;
  if(t.choice)h+=`<div class="mychoice"><span>${esc(t.choice)}</span></div>`;
  if(t.check&&t.check.safe){h+=`<span class="stamp t-mid"><em>保命</em>${esc(t.check.src||'')}</span>`}
  else if(t.check){const c=t.check;h+=`<span class="stamp ${TCLS[c.tier]}"><em>${esc(c.tier)}</em>${esc(c.attr)} ${c.value}${c.bonus?`${c.bonus>0?'+':''}${c.bonus}`:''} / 需 ${c.need}${c.src?`<small>${esc(c.src)}</small>`:''}</span>`}
  h+=(t.story||[]).map(paraEl).join('');
  h+=changesEl(t.changes);
  if(t.actEnd)h+=`<div class="changes"><div class="sum"><b>第${CN[t.act]||t.act}幕 · 终</b><i>江湖录里添了新的一章</i></div></div>`;

  d.innerHTML=h;return d;
}

function doRest(kind,sub){

  if(kind==='走动'){const r=applyChange({target:sub,delta:2});if(r)ch.push({...r,reason:'一起说了好些话'});label='走动 · '+((PEOPLE[sub]||{full:sub}).full)}

  else{const c=o.check,base=getVal(c.attr),bonus=Number(c.bonus)||0,need=Number(c.need)||7;check={attr:c.attr,value:base,bonus,src:c.bonus_source||'',need,tier:tierOf(base+bonus-need)}}

function nodeInfo(){const a=S.act,list=ACT_NODES[a]||[],done=S.nodesDone[a]||[];const next=list.find(n=>!done.includes(n));return{本幕节点顺序:list,已完成:done,下一个:next||'本幕节点已全部演完，本回合结束本幕'}}

async function ask(input){

function buildPrompt(input){
  const t=storyText,i6=t.indexOf('## 六'),i7=t.indexOf('## 七'),i8=t.indexOf('## 八');
  if(i6<0||i7<0||i8<0)return t;
  let act=S.act;if(input&&input.type==='next_act')act=Math.min(S.act+1,5);
  const common=t.slice(0,i6),six=t.slice(i6,i7),seven=t.slice(i7,i8),eight=t.slice(i8);
  const heads=['第一幕','第二幕','第三幕','第四幕','第五幕'];
  const st=six.indexOf('### '+heads[act-1]);const nx=act<5?six.indexOf('### '+heads[act]):-1;
  const head=six.slice(0,six.indexOf('### 第一幕'));
  const cur=st<0?six:six.slice(st,nx<0?undefined:nx);
  return common+head+cur+(act>=5?'\n'+seven+eight:'\n（宫门规则与结局在第五幕才会给你，现在不需要。）');
}
async function callDeepSeek(input){

  else{const c=input.check||{};now={玩家选择:input.choice,检定结果:{属性:c.attr,玩家数值:c.value,加成:c.bonus||0,门槛:c.need,结果:c.tier,网页已结算:(c.res||[]).map(x=>`${x.label} ${x.d>0?'+':''}${x.d}（${x.reason||''}）`)}}}

  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),90000);

    body:JSON.stringify({model:cfg.model||'deepseek-chat',temperature:0.8,max_tokens:2600,response_format:{type:'json_object'},messages:[{role:'system',content:buildPrompt(input)+'\n\n'+PROTOCOL},{role:'user',content:'请按协议输出 json。\n'+JSON.stringify(user)}]})});

}
function parseJSON(t){t=String(t).trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();const a=t.indexOf('{'),b=t.lastIndexOf('}');return JSON.parse(t.slice(a,b+1))}

function applyResponse(r,input){

  S.revived=false;

  {const lt=lastPlayTurn(),ended=!!(lt&&lt.actEnd),cnt=actCount(S.act);
    let na=Number(r.scene&&r.scene.act)||S.act;
    if(input.type==='next_act'||(ended&&input.type!=='start'&&!r.ending))na=Math.min(S.act+1,5);

  const t={act:S.act,node:S.node,actStart:(input.type==='start'||S.act>prevAct)?S.act:0,choice:input.choice||'',check:input.check||null,story:splitLong(r.story),changes:merged,prompt:r.act_end?'':(r.prompt||''),actEnd:!!r.act_end};

function renderChron(){
  const head=`<h2 class="pg-title">江湖录</h2><p class="pg-sub">只记主线。玩完从头翻，就是你自己的一卷书。</p>${S.goal&&!S.trialEnd?`<div class="goalbox"><span class="gt2">眼下</span>${esc(S.goal)}</div>`:''}`;
  let body='';
  for(let a=1;a<=S.act;a++){
    const ch=S.chapters[a];
    if(ch){body+=`<div class="chapter"><h3><span class="n">第${CN[a]||a}幕</span><span class="t">${esc(ACT_NAMES[a]||'')}</span></h3>${ch.split(/\n+/).filter(Boolean).map(p=>`<p>${esc(p)}</p>`).join('')}</div>`}
    else{const fs=S.facts.filter(f=>f.act===a);body+=`<div class="chron-act"><h3><span class="n">第${CN[a]||a}幕</span><span class="t">${esc(ACT_NAMES[a]||'')}</span><span class="tr">· 进行中</span></h3>${fs.length?`<ul class="tl">${fs.map(f=>`<li>${esc(f.text)}</li>`).join('')}</ul>`:'<div class="empty">这一幕才刚开始。</div>'}</div>`}
  }
  if(S.ended&&S.ended.type!=='中断')body+=`<div class="chapter"><h3><span class="n">你的一生</span><span class="t">${esc(S.ended.title||'')}</span></h3>${lifeHtml(S.ended)}</div>`;
  if(S.ended&&S.ended.type!=='中断')body+=`<div class="chapter"><h3><span class="n">全书背景</span><span class="t">你不知道的事</span></h3>${BACKSTORY.map(([h,p])=>`<p style="text-indent:0;margin-top:14px"><b>${esc(h)}</b></p><p>${esc(p)}</p>`).join('')}</div>`;
  else if(!S.ended)body+=`<div class="chron-act"><h3><span class="n">全书背景</span><span class="t">走完结局后解锁</span></h3></div>`;
  if(S.deaths)body+=`<div class="chron-act"><h3><span class="n">生死簿</span><span class="t">死过 ${S.deaths} 次</span></h3><ul class="tl">${(S.deathLog||[]).map(d=>`<li><span class="nd">第${CN[d.act]||d.act}幕·${esc(d.node)}</span>${esc(d.text)}</li>`).join('')}</ul></div>`;
  $('#chron').innerHTML=head+body;
}

   <div class="box"><div class="gt">物品</div><div class="tags">${S.items.map(x=>`<span class="tag">${esc(x)}</span>`).join('')||'<span class="note">空空如也</span>'}</div><div class="gt" style="margin-top:14px">线索</div><div class="tags">${S.clues.map(x=>`<span class="tag">${esc(x)}</span>`).join('')||'<span class="note">暂无</span>'}</div></div>
   <div class="box"><div class="gt">记下的事</div><div class="tags">${fl||'<span class="note">暂无</span>'}</div></div>
   <div class="box" style="grid-column:1/-1"><div class="gt">存档</div><div class="actions"><button id="bExport">导出存档码</button><button id="bImport">导入存档码</button><button id="bCfg">设置</button><button id="bReset">重开一局</button></div>${demo?'<div class="note" style="margin-top:8px">演示模式：剧情是固定的，不会存档。</div>':''}</div></div>`;
  $('#bExport').onclick=exportSave;$('#bImport').onclick=importSave;$('#bCfg').onclick=()=>openCfg();
  $('#bReset').onclick=()=>confirmBox('重开会清掉当前进度，确定吗？',()=>{store.del(SAVE_KEY);S=null;show('cover');refreshCover()});
}
function renderSide(){
  if(!S)return;const f=Object.entries(S.favor).filter(([k])=>k!=='小满'||S.favor['小满']>0).map(([k,v])=>bar((PEOPLE[k]||{full:k}).full,v,20,'fog')).join('');
  $('#side').innerHTML=`<h3>${esc(S.name)}</h3><div class="alias">${alias()?'「'+esc(alias())+'」':''}</div><div class="note">江湖地位 · ${rankOf()}</div><div class="gt">属性</div>${bar('武力',S.attrs['武力'],20)}${bar('机敏',S.attrs['机敏'],20)}${bar('声望',S.attrs['声望'],20)}${bar('健康',S.attrs['健康'],S.hpMax,S.attrs['健康']<=2?'red':'')}${bar('暴露',S.expo,10,'red')}<div class="gt">银两</div><div class="note" style="color:var(--fog)">${S.money} 两</div><div class="gt">好感</div>${f}${S.enemy['司徒厉']>0?`<div class="gt">敌意</div>${bar('司徒厉',S.enemy['司徒厉'],20,'red')}`:''}`;
  if(tab==='bag')renderBag();if(tab==='people')renderPeople();if(tab==='chron')renderChron();
}
$('#btnHome').onclick=()=>{show('cover');refreshCover()};

/* 弹窗 */
function modal(html){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="card">${html}</div>`;m.onclick=e=>{if(e.target===m)m.remove()};$('#modalRoot').appendChild(m);return m}
function recap(){
  const fs=S.facts.slice(-4),acts=Object.keys(S.chapters).map(Number).sort((a,b)=>a-b),lc=acts.length?S.chapters[acts[acts.length-1]]:'';
  const first=lc?lc.split(/\n+/).filter(Boolean).slice(-1)[0]:'';
  const m=modal(`<div class="recap"><h2 class="sec-title">前情提要</h2><p class="sec-sub">第${CN[S.act]||S.act}幕 · ${esc(ACT_NAMES[S.act]||'')} · ${esc(S.place||'')}</p>${first?`<div class="sum">${esc(first)}</div>`:''}${fs.length?`<ul>${fs.map(f=>`<li>${esc(f.text)}</li>`).join('')}</ul>`:''}${S.goal?`<p class="note" style="color:var(--teal)">眼下：${esc(S.goal)}</p>`:''}<div class="btn-col" style="margin-top:12px"><button class="btn primary" id="rGo">接着走</button><button class="btn" id="rChron">翻翻江湖录</button></div></div>`);
  m.querySelector('#rGo').onclick=()=>m.remove();m.querySelector('#rChron').onclick=()=>{m.remove();setTab('chron')};
}
function showTrialEnd(){const m=modal(`<div class="ending"><div class="k">试玩</div><h2>第一幕 · 终</h2><div class="txt"><p class="para">第一幕到这里就结束了。江湖录里已经替你写好了这一章。</p><p class="para">哪里别扭、哪里好玩、哪里看不懂，都告诉作者，下一幕会照着改。</p></div><div class="btn-col" style="margin-top:14px"><button class="btn primary" id="teChron">翻看江湖录</button><button class="btn" id="teClose">留在这里看看</button></div></div>`);m.querySelector('#teChron').onclick=()=>{m.remove();setTab('chron')};m.querySelector('#teClose').onclick=()=>m.remove()}
function openCfg(fromStart){
  const m=modal(`<h2 class="sec-title">DeepSeek Key</h2><p class="sec-sub">完整游戏需要你自己的 DeepSeek Key。它只存在你这台设备的浏览器里，不会发给作者。</p><ol class="steps"><li>浏览器打开 platform.deepseek.com，注册登录</li><li>在「充值」里先充一点钱（按用量计费）</li><li>进入「API keys」，点「创建」，复制那一串 sk- 开头的字</li><li>粘贴到下面，保存</li></ol>
  <div class="field"><label for="cKey">API Key</label><input type="password" id="cKey" placeholder="sk-..." value="${esc(cfg.key)}"></div>
  <details style="font-family:var(--ui);font-size:13px;margin-bottom:14px"><summary class="muted">高级设置</summary><div class="field" style="margin-top:10px"><label for="cBase">接口地址（直连失败时可填中转）</label><input type="text" id="cBase" value="${esc(cfg.base)}"></div><div class="field"><label for="cModel">模型</label><input type="text" id="cModel" value="${esc(cfg.model)}"></div></details>
  <div class="btn-col"><button class="btn primary" id="cSave">保存${fromStart?'并开始':''}</button>${fromStart?'<button class="btn" id="cDemo">先看演示</button>':''}<button class="btn" id="cClose">关闭</button></div>`);
  m.querySelector('#cSave').onclick=()=>{cfg={key:m.querySelector('#cKey').value.trim(),base:m.querySelector('#cBase').value.trim()||'https://api.deepseek.com',model:m.querySelector('#cModel').value.trim()||'deepseek-chat'};store.set(CFG_KEY,cfg);m.remove();refreshCover();if(fromStart&&cfg.key){S=newState(C);store.set(SAVE_KEY,S);enterGame()}};
  m.querySelector('#cClose').onclick=()=>m.remove();const dm=m.querySelector('#cDemo');if(dm)dm.onclick=()=>{m.remove();$('#btnDemo').click()};
}
function exportSave(){const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));const m=modal(`<h2 class="sec-title">存档码</h2><p class="sec-sub">复制保存好。换设备时在「导入存档码」里粘贴。</p><textarea id="eCode" readonly>${code}</textarea><div class="btn-col" style="margin-top:12px"><button class="btn primary" id="eCopy">复制</button><button class="btn" id="eClose">关闭</button></div>`);m.querySelector('#eCopy').onclick=()=>{const ta=m.querySelector('#eCode');(navigator.clipboard?navigator.clipboard.writeText(code):Promise.reject()).then(()=>toast('已复制')).catch(()=>{ta.select();toast('已选中，请手动复制')})};m.querySelector('#eClose').onclick=()=>m.remove()}
function importSave(){const m=modal(`<h2 class="sec-title">导入存档码</h2><textarea id="iCode" placeholder="粘贴存档码"></textarea><div class="err" id="iErr"></div><div class="btn-col" style="margin-top:8px"><button class="btn primary" id="iGo">导入</button><button class="btn" id="iClose">关闭</button></div>`);m.querySelector('#iGo').onclick=()=>{try{const s=JSON.parse(decodeURIComponent(escape(atob(m.querySelector('#iCode').value.trim()))));if(!s.attrs)throw 0;S=upgrade(s);demo=false;store.set(SAVE_KEY,S);m.remove();enterGame(true)}catch(e){m.querySelector('#iErr').textContent='存档码不对，检查一下有没有复制完整。'}};m.querySelector('#iClose').onclick=()=>m.remove()}
function confirmBox(msg,ok){const m=modal(`<p>${esc(msg)}</p><div class="btn-col"><button class="btn primary" id="yOk">确定</button><button class="btn" id="yNo">取消</button></div>`);m.querySelector('#yOk').onclick=()=>{m.remove();ok()};m.querySelector('#yNo').onclick=()=>m.remove()}
function lifeHtml(e){
  const f=S.flags,rows=[['出身',S.origin],['天赋',S.talents.join('、')],['名号',f['名号']||'没有名号'],['江湖地位',rankOf()],['路遇少年',{'深':'拔刀相救','浅':'引开追兵','无':'没有出手'}[f['交情']]||'—'],['老聂的信',(f['拆信']?'拆过，':'')+({'早到':'早早送到','晚到':'晚了一步','失败':'被人搜去看过'}[f['信']]||'—')],['落雁峡',f['落雁峡']||'—'],['死过',(S.deaths||0)+' 次'],['结局',e.title||'']];
  return `${e.life?String(e.life).split(/\n+/).map(p=>`<p class="para">${esc(p)}</p>`).join(''):''}<div class="keys" style="margin-top:10px">${rows.map(([k,v])=>`<div style="display:flex;gap:10px"><span style="color:var(--teal);min-width:5em">${esc(k)}</span><span>${esc(v)}</span></div>`).join('')}</div>`;
}
function showLife(e){const m=modal(`<div class="ending"><div class="k">你的一生</div><h2>${esc(S.name)}</h2>${lifeHtml(e)}<div class="btn-col" style="margin-top:14px"><button class="btn" id="lfClose">合上</button></div></div>`);m.querySelector('#lfClose').onclick=()=>m.remove()}
function showEnding(e){const keys=(e.keys||[]).map(k=>`<li>${esc(k)}</li>`).join('');const m=modal(`<div class="ending"><div class="k">${e.type==='中断'?'中断结局':'结局'}</div><h2>${esc(e.title||'')}</h2><div class="txt">${String(e.text||'').split(/\n+/).map(p=>`<p class="para">${esc(p)}</p>`).join('')}</div>${e.turning_point?`<p class="note" style="color:var(--gold)">你的江湖，是从「${esc(e.turning_point)}」那一步开始拐弯的。</p>`:''}${keys?`<div class="keys">决定这个结局的关键<ul>${keys}</ul></div>`:''}<div class="btn-col" style="margin-top:14px">${e.type!=='中断'?'<button class="btn primary" id="enLife">你的一生</button>':''}<button class="btn" id="enNew">再走一遍江湖</button><button class="btn" id="enChron">翻看江湖录</button><button class="btn" id="enClose">留在这里看看</button></div></div>`);const lb=m.querySelector('#enLife');if(lb)lb.onclick=()=>{m.remove();showLife(e)};m.querySelector('#enNew').onclick=()=>{store.del(SAVE_KEY);m.remove();S=null;openCreate()};m.querySelector('#enChron').onclick=()=>{m.remove();setTab('chron')};m.querySelector('#enClose').onclick=()=>m.remove()}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}

refreshCover();renderCreate();show('cover');
})();

</script>

</body>
</html>
